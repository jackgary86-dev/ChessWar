  <rect x="20" y="80" width="60" height="60" fill="#9c805a"/><rect x="80" y="80" width="60" height="60" fill="#dccca5"/></g>
  <!-- 8x8 pixel pawn at 5px per pixel -->
  <g fill="#1c1914"><rect x="45" y="27" width="10" height="5"/><rect x="40" y="32" width="5" height="10"/><rect x="55" y="32" width="5" height="10"/><rect x="45" y="42" width="10" height="5"/><rect x="40" y="52" width="20" height="5"/><rect x="35" y="57" width="5" height="10"/><rect x="60" y="57" width="5" height="10"/><rect x="35" y="67" width="30" height="5"/></g>
  <g fill="#f1e9d4"><rect x="45" y="32" width="10" height="10"/><rect x="45" y="57" width="15" height="5"/><rect x="40" y="62" width="20" height="5"/></g>
