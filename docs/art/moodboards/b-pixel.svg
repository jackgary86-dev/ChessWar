  <text x="170" y="72" font-family="monospace" font-size="11" fill="#a39985">Nf3 x e5   +3 gold</text>
  <rect x="170" y="90" width="120" height="8" fill="#3b3529"/><rect x="170" y="90" width="84" height="8" fill="#d3a64d"/>
  <text x="20" y="170" font-family="sans-serif" font-size="11" fill="#a39985">B · Pixel art: 16x16 sprites, hard palette, integer scaling only.</text>
  <text x="20" y="186" font-family="sans-serif" font-size="11" fill="#a39985">Charming, but knights and bishops blur at 28 px and it needs 3 scale sets.</text>
